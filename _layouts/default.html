<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />

    <title>{% if page.title %}{{ page.title }}{% elsif site.title %}{{ site.title }}{% else %}{% endif %}</title>

    <link rel="stylesheet" href="https://pother.ca/CssBase/css/ribbon.css">
    <link rel="stylesheet" href="https://pother.ca/CssBase/css/created-by-potherca.css">
    <link rel="stylesheet" href="main.css" />
</head>

<body>

    <h1>
        {% if page.title %}{{ page.title }}{% elsif site.title %}{{ site.title }}{% else %}{% endif %}
    </h1>

    {{ content }}

    <footer>
        <div class="banner banner-right banner-fixed">
            <a href="https://github.com/potherca-blog/VariableNamingConvention/tree/master/README.md">
                Visit on Github
            </a>
        </div>
    </footer>

    <script>
        /* Add classes to plain elements to active PureCss Styles */
        document.querySelectorAll('table').forEach(function (p_oElement) {
            let sClass;

            const sText = p_oElement.querySelector('thead th:first-child').textContent

            switch (sText) {
                case 'Language':
                    sClass = 'example-table';
                    break;
                case 'Prefix':
                    sClass = 'scope-table';
                    break;
            }

            p_oElement.classList.add(sClass);
        });

        /* Wrap letters in SVG to match the Syntax Diagram */
        document.querySelectorAll('tbody td:first-child').forEach(function(p_oElement) {
            var sText;

            sText = p_oElement.textContent.trim();

            if (sText.length === 1) {
                p_oElement.innerHTML = `<td><svg xmlns="http://www.w3.org/2000/svg" width="24" height="28"><rect x="2" y="3" width="21" height="24" rx="6"/><rect x="1" y="1" width="21" height="24" class="terminal" rx="6"/><text class="terminal" x="8" y="16">${sText}</text></svg></td>`;

            }
        });
    </script>
</body>
</html>
